name: API verification
on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: genie_vina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d genie_vina_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/genie_vina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-tools.txt
      - run: python -m pytest -q
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- API/openapi.json API/orders.yaml
      - run: python scripts/build_presentation.py
