services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genie_vina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - genie_vina_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d genie_vina']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  genie_vina_data:
